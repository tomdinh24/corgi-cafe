project_id = "corgi-cafe"

[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56322
shadow_port = 56320
major_version = 17

[studio]
enabled = true
port = 56323

[inbucket]
enabled = true
port = 56324

[analytics]
enabled = true
port = 56327

[auth]
enabled = true
site_url = "https://corgi-cafe-eight.vercel.app"
additional_redirect_urls = ["https://corgi-cafe-eight.vercel.app/auth/callback", "https://corgi-cafe-git-corgi-communit-51dc63-tom-lams-projects-83341c9d.vercel.app/auth/callback", "https://*-tom-lams-projects-83341c9d.vercel.app/**", "http://localhost:4315", "http://localhost:4315/auth/callback", "http://127.0.0.1:4315/auth/callback", "http://localhost:4313", "http://localhost:4313/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_expiry = 3600

# Corgi-branded 6-digit sign-in email is ready at ./supabase/templates/magic_link.html. Applying it
# (and the {{ .Token }}-in-subject that splits Gmail threads) is BLOCKED on the free tier's default
# email provider — Supabase returns 400 "Email template modification is not available for free tier
# projects using the default email provider." Unblock by adding a custom SMTP provider (e.g. Resend)
# in the dashboard, or upgrading to Pro, then uncomment the block below and `supabase config push`.
# [auth.email.template.magic_link]
# subject = "{{ .Token }} is your Corgi Cafe sign-in code"
# content_path = "./supabase/templates/magic_link.html"

[storage]
enabled = true
file_size_limit = "5MiB"

